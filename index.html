<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Копия. Право на существование</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; height: 100%; font-family: Arial, sans-serif; }
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            border-bottom: 2px solid #d4af37; /* Золотая линия */
        }
        .header h1 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
        .pdf-container {
            width: 100%;
            height: calc(100vh - 60px);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 20px;
        }
        button {
            padding: 10px 20px;
            background: #d4af37;
            color: #1a1a1a;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        button:hover { background: #b89a33; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Копия. Право на существование</h1>
    </div>
    <div class="pdf-container">
        <!-- Ссылка на твой PDF файл -->
        <iframe id="pdfFrame" src="book.pdf#toolbar=0&navpanes=0&view=FitH" allowfullscreen></iframe>
    </div>
    <div class="controls">
        <button onclick="prevPage()">← Назад</button>
        <button onclick="nextPage()">Вперёд →</button>
    </div>

    <script>
        const pdfFrame = document.getElementById('pdfFrame');
        let currentPage = 1;
        const totalPages = 72; // Твое число страниц

        function updatePdf(page) {
            // Формируем ссылку с нужным номером страницы
            pdfFrame.src = `book.pdf#toolbar=0&navpanes=0&view=FitH&page=\${page}`;
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePdf(currentPage);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePdf(currentPage);
            }
        }

        // Обработка клавиш на клавиатуре
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });
    </script>
</body>
</html>
